{% load static i18n %}
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Server Error" %} — getNexiro</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=5.2">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
        .error-code { font-size: 6rem; font-weight: 800; background: linear-gradient(135deg, #ef4444, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div style="padding: 2rem;">
        <div class="error-code">500</div>
        <h1 style="font-size: 1.5rem; color: #f8fafc; margin-bottom: 1rem;">{% trans "Something went wrong" %}</h1>
        <p style="color: #94a3b8; margin-bottom: 2rem; max-width: 400px; margin-inline: auto;">
            {% trans "We're experiencing a temporary issue. Please try again in a few moments." %}
        </p>
        <a href="/" style="display: inline-block; padding: 0.75rem 1.5rem; background: linear-gradient(135deg, #0ea5e9, #6366f1); color: white; border-radius: 12px; text-decoration: none; font-weight: 600;">
            {% trans "Back to Home" %}
        </a>
    </div>
</body>
</html>
