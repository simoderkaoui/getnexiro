{% load i18n %}
{# ═══ FAQ Section ═══ #}
{% if faqs %}
<section class="section faq-section-component">
    <div class="container">
        <div class="text-center" style="margin-bottom: 2.5rem;">
            <div class="badge-tag">{% trans "FAQ" %}</div>
            <h2 class="section-title">{% trans "Frequently Asked Questions" %}</h2>
        </div>
        <div class="faq-accordion-container" style="max-width: 820px; margin: 0 auto;">
            {% for faq in faqs %}
            <details class="faq-accordion-item" name="getnexiro-faq">
                <summary class="faq-accordion-btn">
                    <span class="faq-question-text">{{ faq.question }}</span>
                    <span class="faq-toggle-icon" aria-hidden="true">+</span>
                </summary>
                <div class="faq-accordion-body">
                    <div class="faq-accordion-content">{{ faq.answer|linebreaksbr }}</div>
                </div>
            </details>
            {% endfor %}
        </div>
    </div>
</section>

<style>
.faq-section-component {
    padding: 4rem 0;
}
.faq-accordion-item {
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.faq-accordion-btn {
    width: 100%;
    background: transparent;
    border: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
    padding: 1.35rem 0.5rem;
    font-size: 1.05rem;
    font-weight: 600;
    color: #f1f5f9;
    text-align: left;
    font-family: inherit;
    list-style: none;
    user-select: none;
    transition: color 0.2s ease;
}
.faq-accordion-btn::-webkit-details-marker,
.faq-accordion-btn::marker {
    display: none;
    content: "";
}
[dir="rtl"] .faq-accordion-btn {
    text-align: right;
}
.faq-accordion-btn:hover {
    color: var(--color-primary, #38bdf8);
}
.faq-accordion-btn:focus-visible {
    outline: 2px solid var(--color-primary, #38bdf8);
    outline-offset: 3px;
    border-radius: 6px;
}
.faq-question-text {
    flex: 1;
}
.faq-toggle-icon {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #94a3b8;
    font-size: 1.35rem;
    line-height: 1;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s, color 0.2s, border-color 0.2s;
}
.faq-accordion-item[open] .faq-toggle-icon {
    transform: rotate(45deg);
    background: rgba(56, 189, 248, 0.18);
    border-color: rgba(56, 189, 248, 0.4);
    color: #38bdf8;
}
.faq-accordion-item[open] .faq-question-text {
    color: #38bdf8;
}
.faq-accordion-body {
    font-size: 0.95rem;
    color: #cbd5e1;
    line-height: 1.8;
    padding: 0 0.5rem 1.5rem 0.5rem;
    animation: faq-slide-down 0.25s ease-out;
}
@keyframes faq-slide-down {
    from {
        opacity: 0;
        transform: translateY(-8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
.faq-accordion-content {
    color: #cbd5e1;
}
</style>
{% endif %}
