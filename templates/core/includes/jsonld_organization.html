{% load static %}
{# Organization + ProfessionalService JSON-LD — values from SiteConfig model #}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": ["ProfessionalService", "Organization"],
    "name": "{{ config.site_name|default:'getNexiro' }}",
    "description": "{{ config.meta_description|escapejs }}",
    "url": "{{ SITE_URL }}",
    "logo": "{{ SITE_URL }}{% static 'images/logo.png' %}",
    "image": "{{ SITE_URL }}{% static 'images/og-image.png' %}",
    "telephone": "{{ config.phone|default:'+212787862187' }}",
    "email": "{{ config.email|default:'contact@getnexiro.com' }}",
    "address": {
        "@type": "PostalAddress",
        "streetAddress": "{{ config.address_detail_en|escapejs }}",
        "addressLocality": "Tangier",
        "postalCode": "90000",
        "addressRegion": "Tanger-Tetouan-Al Hoceima",
        "addressCountry": "MA"
    },
    "geo": {
        "@type": "GeoCoordinates",
        "latitude": "35.7796",
        "longitude": "-5.8030"
    },
    "areaServed": [
        {"@type": "City", "name": "Tangier"},
        {"@type": "City", "name": "Tetouan"},
        {"@type": "City", "name": "Fes"},
        {"@type": "City", "name": "Meknes"},
        {"@type": "AdministrativeArea", "name": "Northern Morocco"}
    ],
    "priceRange": "$$",
    {# TODO(owner): Confirm physical studio opening hours before re-enabling openingHoursSpecification in schema #}
    "sameAs": [
        {% if config.instagram_url %}"{{ config.instagram_url }}"{% endif %}{% if config.instagram_url and config.linkedin_url %},{% endif %}
        {% if config.linkedin_url %}"{{ config.linkedin_url }}"{% endif %}{% if config.linkedin_url and config.twitter_url %},{% endif %}
        {% if config.twitter_url %}"{{ config.twitter_url }}"{% endif %}
    ],
    "knowsAbout": ["Web Development", "Mobile App Development", "UI/UX Design", "Django", "React", "Flutter", "Cloud Computing", "API Development"],
    "foundingLocation": {
        "@type": "Place",
        "name": "Tangier, Morocco"
    },
    "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Software Engineering & Digital Services",
        "itemListElement": [
            {
                "@type": "OfferCatalog",
                "name": "Web Development",
                "itemListElement": [
                    {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Corporate & SaaS Web Development"}},
                    {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "E-Commerce Platforms & Gateways"}}
                ]
            },
            {
                "@type": "OfferCatalog",
                "name": "Mobile Applications",
                "itemListElement": [
                    {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "iOS & Android Mobile App Engineering"}},
                    {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Cross-Platform Flutter & React Native"}}
                ]
            },
            {
                "@type": "OfferCatalog",
                "name": "UI/UX & Design Systems",
                "itemListElement": [
                    {"@type": "Offer", "itemOffered": {"@type": "Service", "name": "Interactive Figma Prototyping & Design Systems"}}
                ]
            }
        ]
    }
}
</script>

{# WebSite JSON-LD with multilingual inLanguage #}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ config.site_name|default:'getNexiro' }}",
    "url": "{{ SITE_URL }}/",
    "inLanguage": ["en", "fr", "ar"],
    "potentialAction": {
        "@type": "SearchAction",
        "target": {
            "@type": "EntryPoint",
            "urlTemplate": "{{ SITE_URL }}/{{ LANGUAGE_CODE }}/blog/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
    }
}
</script>
