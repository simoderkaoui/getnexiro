{% load static i18n %}
{# Comprehensive Article & BreadcrumbList JSON-LD for Google Rich Results #}
{% if post %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "BlogPosting",
            "@id": "{{ SITE_URL }}{{ request.path }}#article",
            "isPartOf": {
                "@type": "WebPage",
                "@id": "{{ SITE_URL }}{{ request.path }}"
            },
            "headline": "{{ post.title|escapejs }}",
            "alternativeHeadline": "{{ post.meta_title|default:post.title|escapejs }}",
            "description": "{{ post.meta_description|default:post.excerpt|escapejs }}",
            "inLanguage": "{{ LANGUAGE_CODE }}",
            "mainEntityOfPage": "{{ SITE_URL }}{{ request.path }}",
            {% if post.featured_image %}
            "image": {
                "@type": "ImageObject",
                "url": "{{ SITE_URL }}{{ post.featured_image.url }}",
                "width": 1200,
                "height": 630,
                "caption": "{{ post.featured_image_alt|default:post.title|escapejs }}"
            },
            {% endif %}
            "datePublished": "{{ post.published_at|date:'c' }}",
            "dateModified": "{{ post.updated_at|date:'c' }}",
            "author": {
                "@type": "Person",
                "name": "{{ post.author_name|default:'getNexiro Engineering Team'|escapejs }}",
                "jobTitle": "Software Architect",
                "worksFor": {
                    "@type": "Organization",
                    "name": "{{ config.site_name|default:'getNexiro' }}"
                }
            },
            "publisher": {
                "@type": "Organization",
                "@id": "{{ SITE_URL }}/#organization",
                "name": "{{ config.site_name|default:'getNexiro' }}",
                "url": "{{ SITE_URL }}/",
                "logo": {
                    "@type": "ImageObject",
                    "url": "{{ SITE_URL }}{% static 'images/logo.png' %}"
                }
            },
            {% if post.category %}
            "articleSection": "{{ post.category.name|escapejs }}",
            {% endif %}
            {% if post.meta_keywords %}
            "keywords": "{{ post.meta_keywords|escapejs }}",
            {% endif %}
            "timeRequired": "PT{{ post.reading_time_minutes|default:6 }}M",
            "wordCount": "{{ post.body|striptags|wordcount }}"
        },
        {
            "@type": "BreadcrumbList",
            "@id": "{{ SITE_URL }}{{ request.path }}#breadcrumb",
            "itemListElement": [
                {
                    "@type": "ListItem",
                    "position": 1,
                    "name": "{% trans 'Home' %}",
                    "item": "{{ SITE_URL }}/"
                },
                {
                    "@type": "ListItem",
                    "position": 2,
                    "name": "{% trans 'Blog' %}",
                    "item": "{{ SITE_URL }}{% url 'core:blog' %}"
                },
                {% if post.category %}
                {
                    "@type": "ListItem",
                    "position": 3,
                    "name": "{{ post.category.name|escapejs }}",
                    "item": "{{ SITE_URL }}{% url 'core:blog_category_archive' post.category.slug %}"
                },
                {
                    "@type": "ListItem",
                    "position": 4,
                    "name": "{{ post.title|escapejs }}",
                    "item": "{{ SITE_URL }}{{ request.path }}"
                }
                {% else %}
                {
                    "@type": "ListItem",
                    "position": 3,
                    "name": "{{ post.title|escapejs }}",
                    "item": "{{ SITE_URL }}{{ request.path }}"
                }
                {% endif %}
            ]
        }
    ]
}
</script>
{% endif %}
