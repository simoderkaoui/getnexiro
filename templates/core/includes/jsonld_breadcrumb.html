{% load i18n %}
{# BreadcrumbList JSON-LD — pass breadcrumbs as list of dicts: [{name, url}] #}
{% if breadcrumbs %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {% for bc in breadcrumbs %}
        {
            "@type": "ListItem",
            "position": {{ forloop.counter }},
            "name": "{{ bc.name|escapejs }}",
            "item": "{{ SITE_URL }}{{ bc.url }}"
        }{% if not forloop.last %},{% endif %}
        {% endfor %}
    ]
}
</script>
{% endif %}
