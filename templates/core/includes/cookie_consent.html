{% load i18n %}
{# Cookie Consent Banner — Only loads analytics after user accepts #}
<div id="cookieConsent" class="cookie-consent" style="display: none;" role="dialog" aria-label="{% trans 'Cookie Consent' %}">
    <div class="cookie-consent-inner">
        <div class="cookie-consent-text">
            <p>
                {% blocktrans %}We use cookies to analyze site usage and improve your experience. By clicking "Accept", you consent to our use of analytics cookies.{% endblocktrans %}
                <a href="{% url 'core:privacy_policy' %}" style="color: var(--color-primary); text-decoration: underline;">{% trans "Privacy Policy" %}</a>
            </p>
        </div>
        <div class="cookie-consent-actions">
            <button id="cookieAccept" class="btn btn-primary btn-sm">{% trans "Accept" %}</button>
            <button id="cookieDecline" class="btn btn-outline btn-sm">{% trans "Decline" %}</button>
        </div>
    </div>
</div>

<style>
.cookie-consent {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    padding: 1rem;
    animation: slideUp 0.4s ease-out;
}
@keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
.cookie-consent-inner {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(56, 189, 248, 0.15);
    border-radius: 16px;
    padding: 1.25rem 1.75rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    flex-wrap: wrap;
}
.cookie-consent-text {
    flex: 1;
    min-width: 200px;
}
.cookie-consent-text p {
    font-size: 0.85rem;
    color: #94a3b8;
    line-height: 1.6;
    margin: 0;
}
.cookie-consent-actions {
    display: flex;
    gap: 0.6rem;
    flex-shrink: 0;
}
</style>

<script>
(function() {
    var consent = localStorage.getItem('cookie_consent');
    if (consent === null) {
        document.getElementById('cookieConsent').style.display = 'block';
    } else if (consent === 'accepted') {
        loadAnalytics();
    }

    document.getElementById('cookieAccept').addEventListener('click', function() {
        localStorage.setItem('cookie_consent', 'accepted');
        document.getElementById('cookieConsent').style.display = 'none';
        loadAnalytics();
    });

    document.getElementById('cookieDecline').addEventListener('click', function() {
        localStorage.setItem('cookie_consent', 'declined');
        document.getElementById('cookieConsent').style.display = 'none';
    });

    function loadAnalytics() {
        {% if ANALYTICS_PROVIDER == 'ga4' and ANALYTICS_ID %}
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id={{ ANALYTICS_ID }}';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', '{{ ANALYTICS_ID }}');
        {% elif ANALYTICS_PROVIDER == 'plausible' and ANALYTICS_ID %}
        var s = document.createElement('script');
        s.defer = true;
        s.setAttribute('data-domain', '{{ ANALYTICS_ID }}');
        s.src = 'https://plausible.io/js/script.js';
        document.head.appendChild(s);
        {% endif %}
    }
})();
</script>
