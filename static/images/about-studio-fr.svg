<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlowFr" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#00d9f5" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGradFr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141c2b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1019" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanLineFr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#080b10"/>
  <rect width="800" height="600" fill="url(#bgGlowFr)"/>

  <!-- Architecture Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="320" y1="0" x2="320" y2="600"/>
    <line x1="440" y1="0" x2="440" y2="600"/>
    <line x1="560" y1="0" x2="560" y2="600"/>
    <line x1="680" y1="0" x2="680" y2="600"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Central Studio Card Structure -->
  <rect x="90" y="70" width="620" height="460" rx="20" fill="url(#cardGradFr)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="90" y="70" width="620" height="50" rx="20" fill="#0f172a" fill-opacity="0.8"/>
  <circle cx="125" cy="95" r="5" fill="#ef4444" opacity="0.7"/>
  <circle cx="145" cy="95" r="5" fill="#f59e0b" opacity="0.7"/>
  <circle cx="165" cy="95" r="5" fill="#10b981" opacity="0.7"/>
  <text x="195" y="100" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">GETNEXIRO // STUDIO D'INGÉNIERIE DE TANGER</text>

  <!-- Studio Coordinate Header -->
  <text x="130" y="165" fill="#00f5a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">LOCALISATION // 35.7595° N, 5.8340° O</text>
  <text x="130" y="200" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Hub d'Ingénierie Logicielle &amp; Cloud</text>
  <text x="130" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Tanger, Maroc — Alignement horaire direct avec l'Europe (GMT+1 / WEST)</text>

  <!-- Visual Feature Blocks -->
  <!-- Block 1: Architecture -->
  <rect x="130" y="260" width="250" height="110" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="158" cy="288" r="14" fill="#00f5a0" fill-opacity="0.1"/>
  <path d="M152 288L156 292L164 284" stroke="#00f5a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="182" y="293" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Cœur Full-Stack</text>
  <text x="150" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Django · PostgreSQL · Vue/React</text>
  <text x="150" y="348" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">APIs haute performance &amp; résilience</text>

  <!-- Block 2: Cloud / DevOps -->
  <rect x="420" y="260" width="250" height="110" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <circle cx="448" cy="288" r="14" fill="#00d9f5" fill-opacity="0.1"/>
  <path d="M442 288L446 292L454 284" stroke="#00d9f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="472" y="293" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Infrastructure Cloud</text>
  <text x="440" y="325" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Docker · Linux · Pipelines CI/CD</text>
  <text x="440" y="348" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Déploiements automatisés sans arrêt</text>

  <!-- Block 3: Strategic Reach -->
  <rect x="130" y="390" width="540" height="90" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
  <text x="160" y="425" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Passerelle Nearshore vers l'Europe &amp; MENA</text>
  <text x="160" y="450" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Au service des entreprises à Tanger Med, Casablanca, Rabat, Paris, Londres et Madrid.</text>

  <!-- Bottom Accent Line -->
  <rect x="90" y="528" width="620" height="2" fill="url(#cyanLineFr)"/>
</svg>
